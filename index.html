<style>
  :root{
    --ink-900:#00351B;
    --ink-700:#0B5C3D;
    --steel-600:#6B6B6B;
    --steel-300:#C4C4C2;
    --paper-050:#F6F6F4;
    --paper-100:#EBEBE8;
    --line:#DBDBD7;
    --amber-600:#B8842A;
    --amber-100:#F1E3C6;
    --moss-600:#004422;
    --moss-100:#D9E6DE;
    --brick-600:#A3402E;
    --brick-100:#F0DAD3;
    --plum-600:#5B6B66;
    --plum-100:#E1E6E4;
    --slate-600:#3F6C7A;
    --slate-100:#D9E5E7;
    --radius-s:6px;
    --radius-m:10px;
    --radius-l:16px;
    --shadow-card:0 1px 2px rgba(24,34,51,.06), 0 4px 14px rgba(24,34,51,.05);
    --font-display:'Space Grotesk',sans-serif;
    --font-body:'IBM Plex Sans',sans-serif;
    --font-mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper-050);
    color:var(--ink-900);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  ::selection{background:var(--amber-100);}
  button{font-family:inherit;}
  input,select{font-family:inherit;}
  h1,h2,h3{font-family:var(--font-display);letter-spacing:-0.01em;margin:0;}
  .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
  a{color:inherit;}
  :focus-visible{outline:2px solid var(--amber-600);outline-offset:2px;}

  /* ---------- Auth gate ---------- */
  #auth-gate{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:24px;
  }
  .auth-card{
    background:#fff;border:1px solid var(--line);border-radius:var(--radius-l);
    padding:36px 32px;max-width:380px;width:100%;box-shadow:var(--shadow-card);
    text-align:center;
  }
  .auth-logo{width:auto;height:46px;margin:0 auto 22px;display:block;}
  .auth-card h1{font-size:20px;margin-bottom:6px;color:var(--ink-900);}
  .auth-card p{color:var(--steel-600);font-size:14px;line-height:1.5;margin:0 0 20px;}
  .btn-primary{
    background:var(--ink-900);color:#fff;border:none;border-radius:var(--radius-s);
    padding:12px 20px;font-size:14px;font-weight:600;cursor:pointer;width:100%;
    transition:transform .12s ease, background .12s ease;
  }
  .btn-primary:hover{background:var(--ink-700);}
  .btn-primary:active{transform:scale(.98);}
  .auth-error{color:var(--brick-600);font-size:13px;margin-top:12px;min-height:16px;}

  /* ---------- App shell ---------- */
  #app{display:none;min-height:100vh;}
  #app.ready{display:flex;}

  .sidenav{
    width:230px;flex-shrink:0;background:var(--ink-900);color:var(--paper-050);
    display:flex;flex-direction:column;padding:22px 16px;
  }
  .sidenav .brand{display:flex;flex-direction:column;align-items:flex-start;gap:9px;padding:2px 4px 22px;}
  .sidenav .brand-logo{width:132px;height:auto;flex-shrink:0;filter:brightness(0) invert(1);}
  .brand-sub{font-family:var(--font-display);font-weight:500;font-size:12px;color:var(--steel-300);line-height:1.3;}
  .brand-sub span{display:block;font-size:11px;opacity:.8;}
  .nav-item{
    display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--radius-s);
    color:var(--steel-300);font-size:13.5px;font-weight:500;cursor:pointer;margin-bottom:2px;
    border:none;background:none;width:100%;text-align:left;
  }
  .nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:.85;}
  .nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
  .nav-item.active{background:var(--paper-050);color:var(--ink-900);}
  .nav-item.active svg{opacity:1;}
  .sidenav-footer{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.12);}
  .who{font-size:12px;color:var(--steel-300);padding:8px 12px;line-height:1.5;}
  .who b{color:#fff;display:block;font-weight:600;font-size:13px;}
  .signout{
    background:none;border:none;color:var(--steel-300);font-size:12px;cursor:pointer;
    padding:8px 12px;text-align:left;width:100%;border-radius:var(--radius-s);
  }
  .signout:hover{background:rgba(255,255,255,.06);color:#fff;}

  main{flex:1;min-width:0;padding:28px 34px 90px;max-width:1180px;}
  .view{display:none;}
  .view.active{display:block;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
  .page-head h2{font-size:23px;}
  .page-head .eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--amber-600);font-weight:600;margin-bottom:4px;display:block;}
  .page-head p.sub{color:var(--steel-600);font-size:13.5px;margin:4px 0 0;}

  /* ---------- Bottom nav (mobile) ---------- */
  .bottomnav{
    display:none;position:fixed;bottom:0;left:0;right:0;background:var(--ink-900);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:40;
    box-shadow:0 -2px 12px rgba(0,0,0,.15);
  }
  .bottomnav-inner{display:flex;justify-content:space-around;}
  .bn-item{
    display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;
    color:var(--steel-300);font-size:10px;font-weight:600;padding:6px 4px;flex:1;cursor:pointer;
  }
  .bn-item svg{width:19px;height:19px;opacity:.8;}
  .bn-item.active{color:var(--amber-100);}
  .bn-item.active svg{opacity:1;}

  /* ---------- Generic components ---------- */
  .card{
    background:#fff;border:1px solid var(--line);border-radius:var(--radius-l);
    padding:20px;box-shadow:var(--shadow-card);
  }
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}

  .kpi{padding:18px 20px;}
  .kpi .label{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--steel-600);font-weight:600;}
  .kpi .value{font-family:var(--font-mono);font-size:26px;font-weight:600;margin-top:8px;color:var(--ink-900);}
  .kpi .delta{font-size:12px;color:var(--moss-600);margin-top:4px;font-weight:500;}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-700);margin-bottom:6px;}
  .field input,.field select{
    width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius-s);
    font-size:14px;background:#fdfdfb;color:var(--ink-900);
  }
  .field input:focus,.field select:focus{border-color:var(--amber-600);outline:none;}
  .field-row{display:flex;gap:12px;}
  .field-row .field{flex:1;}

  .btn{
    border:1px solid var(--line);background:#fff;color:var(--ink-900);border-radius:var(--radius-s);
    padding:9px 15px;font-size:13.5px;font-weight:600;cursor:pointer;
  }
  .btn:hover{border-color:var(--steel-600);}
  .btn.dark{background:var(--ink-900);color:#fff;border-color:var(--ink-900);}
  .btn.dark:hover{background:var(--ink-700);}
  .btn.danger{color:var(--brick-600);border-color:var(--brick-100);}
  .btn.danger:hover{background:var(--brick-100);}
  .btn.small{padding:6px 11px;font-size:12.5px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{
    text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;
    color:var(--steel-600);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);
    white-space:nowrap;
  }
  td{padding:9px 10px;border-bottom:1px solid var(--paper-100);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--paper-050);}
  .num-cell{font-family:var(--font-mono);text-align:right;font-variant-numeric:tabular-nums;}
  .total-row td{font-weight:700;border-top:2px solid var(--ink-900);background:var(--paper-100);}

  /* ---------- Ticket / stamp badge — the signature element ---------- */
  .tag{
    display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);
    font-size:11px;font-weight:700;letter-spacing:.03em;padding:3px 8px 3px 9px;
    border-radius:3px 3px 3px 3px;position:relative;color:#fff;white-space:nowrap;
  }
  .tag::after{
    content:"";position:absolute;right:-3px;top:50%;width:6px;height:6px;
    background:var(--paper-050);border-radius:50%;transform:translateY(-50%);
    box-shadow:1px 0 0 rgba(0,0,0,.08) inset;
  }
  .tag.clip{clip-path:polygon(0 0,100% 0,100% 100%,0 100%,0 60%,4px 50%,0 40%);}
  .tag-0{background:#004422;}
  .tag-1{background:#B8842A;}
  .tag-2{background:#55707C;}
  .tag-3{background:#8B4A3D;}
  .tag-4{background:#6E5B7A;}
  .tag-5{background:#49584F;}
  .swatch{width:10px;height:10px;border-radius:2px;display:inline-block;flex-shrink:0;}
  .swatch.tag-0{background:#004422;} .swatch.tag-1{background:#B8842A;}
  .swatch.tag-2{background:#55707C;} .swatch.tag-3{background:#8B4A3D;}
  .swatch.tag-4{background:#6E5B7A;} .swatch.tag-5{background:#49584F;}

  /* ---------- Calendar grid (Frequência) ---------- */
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:6px;}
  .cal-cell{
    aspect-ratio:1;border:1px solid var(--line);border-radius:var(--radius-s);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    cursor:pointer;background:#fdfdfb;gap:2px;position:relative;padding:2px;
  }
  .cal-cell:hover{border-color:var(--steel-600);}
  .cal-cell .d{font-family:var(--font-mono);font-size:12px;color:var(--steel-600);font-weight:600;}
  .cal-cell.filled .d{color:#fff;position:relative;z-index:1;}
  .cal-cell.filled{border-color:transparent;}
  .cal-cell .sig{font-family:var(--font-mono);font-size:9.5px;font-weight:700;color:#fff;position:relative;z-index:1;letter-spacing:.03em;}
  .cal-cell.weekend{background:var(--paper-100);}
  .cal-cell.empty-slot{visibility:hidden;cursor:default;}
  .cal-legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px;}
  .cal-legend .item{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--steel-600);}

  .obra-picker{position:fixed;inset:0;background:rgba(24,34,51,.45);display:none;align-items:flex-end;justify-content:center;z-index:70;}
  .obra-picker.show{display:flex;}
  @media(min-width:640px){.obra-picker{align-items:center;}}
  .obra-picker-sheet{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:380px;padding:20px;box-shadow:var(--shadow-card);}
  @media(min-width:640px){.obra-picker-sheet{border-radius:var(--radius-l);}}
  .obra-picker-sheet h3{font-size:15px;margin-bottom:2px;}
  .obra-picker-sheet .datestr{font-size:12.5px;color:var(--steel-600);margin-bottom:14px;}

  /* ---------- Novo lançamento (dia + obra) ---------- */
  .obra-chip{
    display:flex;align-items:center;gap:7px;padding:8px 13px;border:1.5px solid var(--line);
    border-radius:20px;background:#fff;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink-900);
  }
  .obra-chip:hover{border-color:var(--steel-600);}
  .obra-chip.active{border-color:var(--ink-900);background:var(--paper-100);}
  .check-row{
    display:flex;align-items:center;gap:11px;padding:10px 6px;border-bottom:1px solid var(--paper-100);cursor:pointer;
  }
  .check-row:last-child{border-bottom:none;}
  .check-row:hover{background:var(--paper-050);}
  .check-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--ink-900);flex-shrink:0;cursor:pointer;}
  .check-row .info{flex:1;min-width:0;}
  .check-row .info .name{font-size:13.5px;font-weight:600;}
  .check-row .info .meta{font-size:11.5px;color:var(--steel-600);}
  .check-row.checked{background:var(--moss-100);}

  /* ---------- Observações / impressão ---------- */
  .obs-item{padding:12px 4px;border-bottom:1px solid var(--paper-100);}
  .obs-item:last-child{border-bottom:none;}
  .obs-item .obs-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:4px;}
  .obs-item .obs-date{font-family:var(--font-mono);font-size:12px;color:var(--amber-600);font-weight:700;}
  .obs-item .obs-who{font-size:12px;color:var(--steel-600);}
  .obs-item .obs-text{font-size:13.5px;line-height:1.5;white-space:pre-wrap;}
  .obs-item .obs-actions{margin-top:6px;}
  #print-area{display:none;}
  @media print{
    body *{visibility:hidden;}
    #print-area, #print-area *{visibility:visible;}
    #print-area{position:absolute;left:0;top:0;width:100%;display:block;padding:16px;}
    #print-area .print-head{margin-bottom:18px;border-bottom:2px solid #000;padding-bottom:10px;}
    #print-area .print-logo{height:32px;margin-bottom:8px;}
    #print-area .obs-item{break-inside:avoid;}
  }
  .obra-opt{
    display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border:1px solid var(--line);
    border-radius:var(--radius-s);background:#fff;margin-bottom:8px;cursor:pointer;font-size:14px;font-weight:600;
    text-align:left;
  }
  .obra-opt:hover{border-color:var(--steel-600);}
  .obra-opt .sig-badge{font-family:var(--font-mono);font-size:11px;color:#fff;padding:2px 7px;border-radius:3px;font-weight:700;}
  .obra-opt.clear{color:var(--brick-600);border-style:dashed;font-weight:600;}

  .progress-bar{height:7px;background:var(--paper-100);border-radius:4px;overflow:hidden;}
  .progress-bar .fill{height:100%;border-radius:4px;}

  .list-row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--paper-100);}
  .list-row:last-child{border-bottom:none;}
  .list-row .info{flex:1;min-width:0;}
  .list-row .info .name{font-weight:600;font-size:14px;}
  .list-row .info .meta{font-size:12px;color:var(--steel-600);margin-top:2px;}
  .list-row .actions{display:flex;gap:6px;flex-shrink:0;}
  .pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--paper-100);color:var(--steel-600);}
  .pill.on{background:var(--moss-100);color:var(--moss-600);}
  .pill.off{background:var(--brick-100);color:var(--brick-600);}

  .empty-state{
    text-align:center;padding:48px 20px;color:var(--steel-600);
  }
  .empty-state .glyph{font-size:26px;margin-bottom:8px;}
  .empty-state h3{font-size:15px;color:var(--ink-900);margin-bottom:4px;}
  .empty-state p{font-size:13px;margin:0;}

  .toast-root{position:fixed;top:18px;right:18px;z-index:100;display:flex;flex-direction:column;gap:8px;}
  .toast{
    background:var(--ink-900);color:#fff;padding:11px 16px;border-radius:var(--radius-s);
    font-size:13px;box-shadow:var(--shadow-card);animation:toastin .2s ease;max-width:300px;
  }
  .toast.err{background:var(--brick-600);}
  .toast.ok{background:var(--moss-600);}
  @keyframes toastin{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:none;}}

  .modal-backdrop{
    position:fixed;inset:0;background:rgba(24,34,51,.45);display:none;
    align-items:center;justify-content:center;z-index:60;padding:20px;
  }
  .modal-backdrop.show{display:flex;}
  .modal{background:#fff;border-radius:var(--radius-l);padding:22px;width:100%;max-width:340px;box-shadow:var(--shadow-card);}
  .modal h3{font-size:15px;margin-bottom:8px;}
  .modal p{font-size:13.5px;color:var(--steel-600);margin:0 0 18px;line-height:1.5;}
  .modal .actions{display:flex;gap:8px;justify-content:flex-end;}

  .segmented{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius-s);overflow:hidden;}
  .segmented button{
    background:#fff;border:none;padding:8px 14px;font-size:13px;font-weight:600;color:var(--steel-600);
    cursor:pointer;border-right:1px solid var(--line);
  }
  .segmented button:last-child{border-right:none;}
  .segmented button.active{background:var(--ink-900);color:#fff;}

  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
  .toolbar .spacer{flex:1;}

  @media(max-width:880px){
    .sidenav{display:none;}
    .bottomnav{display:block;}
    main{padding:18px 16px 84px;max-width:none;}
    .grid-2{grid-template-columns:1fr;}
    .grid-4{grid-template-columns:1fr 1fr;}
  }
</style>
</head>

/* ============================================================
   HELPERS
============================================================ */
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
function brl(v){ return (v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}); }
function pct(v){ return (v||0).toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1}) + "%"; }
function pad2(n){ return String(n).padStart(2,"0"); }
function dateStr(y,m,d){ return `${y}-${pad2(m)}-${pad2(d)}`; }
function daysInMonth(y,m){ return new Date(y, m, 0).getDate(); }
function toast(msg, type){
  const root = document.getElementById("toast-root");
  const el = document.createElement("div");
  el.className = "toast" + (type ? " " + type : "");
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(()=>{ el.style.opacity="0"; el.style.transition="opacity .3s"; setTimeout(()=>el.remove(),300); }, 2600);
}
function escapeHtml(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function periodRange(year, month, tipo){
  const dim = daysInMonth(year, month);
  if(tipo === "q1") return {start:1, end:Math.min(15,dim)};
  if(tipo === "q2") return {start:16, end:dim};
  return {start:1, end:dim};
}
function periodLabel(year, month, tipo){
  const base = `${MESES[month-1]}/${year}`;
  if(tipo === "q1") return `1ª quinzena · ${base} (dias 1–15)`;
  if(tipo === "q2") return `2ª quinzena · ${base} (dia 16–${daysInMonth(year,month)})`;
  return `Mês inteiro · ${base}`;
}
function obraColorClass(obraId){
  const idx = state.obras.findIndex(o => o.id === obraId);
  const i = idx >= 0 ? idx : 0;
  return "tag-" + (i % PALETTE_SIZE);
}
function obraById(id){ return state.obras.find(o=>o.id===id); }
function funcById(id){ return state.funcionarios.find(f=>f.id===id); }

/* ============================================================
   MOTOR DE CÁLCULO — dias trabalhados × valor da diária,
   por funcionário × obra, no período selecionado.
============================================================ */
function computeFechamento(year, month, tipo){
  const {start, end} = periodRange(year, month, tipo);
  const entries = state.frequencia.filter(f=>{
    const d = new Date(f.data + "T00:00:00");
    return d.getFullYear()===year && (d.getMonth()+1)===month && d.getDate()>=start && d.getDate()<=end;
  });

  const obrasAtivas = state.obras.filter(o=>o.ativo!==false);
  const funcsAtivos = state.funcionarios.filter(f=>f.ativo!==false);

  const matrix = {}; // matrix[funcId][obraId] = {dias, valor}
  const totalPorFuncionario = {};
  const totalPorObra = {};
  let grandTotalValor = 0, grandTotalDias = 0;

  funcsAtivos.forEach(f=>{ matrix[f.id]={}; totalPorFuncionario[f.id]=0; });
  obrasAtivas.forEach(o=>{ totalPorObra[o.id]=0; });

  entries.forEach(e=>{
    const f = funcById(e.funcionarioId);
    const o = obraById(e.obraId);
    if(!f || !o) return; // funcionário/obra removido
    if(!matrix[f.id]) matrix[f.id] = {};
    if(!matrix[f.id][o.id]) matrix[f.id][o.id] = {dias:0, valor:0};
    matrix[f.id][o.id].dias += 1;
    matrix[f.id][o.id].valor += Number(f.valorDiaria)||0;
    totalPorFuncionario[f.id] = (totalPorFuncionario[f.id]||0) + (Number(f.valorDiaria)||0);
    totalPorObra[o.id] = (totalPorObra[o.id]||0) + (Number(f.valorDiaria)||0);
    grandTotalValor += Number(f.valorDiaria)||0;
    grandTotalDias += 1;
  });

  return { obrasAtivas, funcsAtivos, matrix, totalPorFuncionario, totalPorObra, grandTotalValor, grandTotalDias, entries };
}

function computeRateioSienge(year, month, tipo, funcionarioId){
  const calc = computeFechamento(year, month, tipo);
  const funcs = funcionarioId ? calc.funcsAtivos.filter(f=>f.id===funcionarioId) : calc.funcsAtivos;
  return funcs.map(f=>{
    const linhas = calc.obrasAtivas.map(o=>{
      const cell = (calc.matrix[f.id] && calc.matrix[f.id][o.id]) || {dias:0,valor:0};
      const totalFunc = calc.totalPorFuncionario[f.id] || 0;
      const peso = totalFunc > 0 ? (cell.valor/totalFunc*100) : 0;
      return { obra:o, dias:cell.dias, valor:cell.valor, peso };
    }).filter(l=>l.dias>0);
    return { funcionario:f, linhas, total: calc.totalPorFuncionario[f.id]||0 };
  }).filter(r=>r.linhas.length>0);
}

/* ============================================================
   FIRESTORE — leitura em tempo real + escrita
============================================================ */
function startListeners(){
  if(!FIREBASE_OK) return;
  const unsubF = onSnapshot(query(collection(db,"funcionarios")), snap=>{
    state.funcionarios = snap.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR"));
    renderAll();
  }, err=>{ console.error(err); toast("Erro ao carregar funcionários. Veja o console.", "err"); });

  const unsubO = onSnapshot(query(collection(db,"obras")), snap=>{
    state.obras = snap.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>(a.ordem??0)-(b.ordem??0) || a.nome.localeCompare(b.nome,"pt-BR"));
    renderAll();
  }, err=>{ console.error(err); toast("Erro ao carregar obras. Veja o console.", "err"); });

  const unsubFr = onSnapshot(query(collection(db,"frequencia")), snap=>{
    state.frequencia = snap.docs.map(d=>({id:d.id, ...d.data()}));
    renderAll();
  }, err=>{ console.error(err); toast("Erro ao carregar frequência. Veja o console.", "err"); });

  const unsubObs = onSnapshot(query(collection(db,"observacoes")), snap=>{
    state.observacoes = snap.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=> a.data===b.data ? (a.criadoEm||0)-(b.criadoEm||0) : (a.data<b.data?1:-1));
    renderAll();
  }, err=>{ console.error(err); toast("Erro ao carregar observações. Veja o console.", "err"); });

  state.unsub.push(unsubF, unsubO, unsubFr, unsubObs);
}

async function saveFuncionario(data, id){
  const docId = id || uid();
  await setDoc(doc(db,"funcionarios",docId), data, {merge:true});
  return docId;
}
async function saveObra(data, id){
  const docId = id || uid();
  if(!id) data.ordem = state.obras.length;
  await setDoc(doc(db,"obras",docId), data, {merge:true});
  return docId;
}
async function removeDoc(col, id){ await deleteDoc(doc(db,col,id)); }

async function setFrequencia(funcionarioId, dataISO, obraId){
  const id = funcionarioId + "_" + dataISO;
  if(!obraId){ await deleteDoc(doc(db,"frequencia",id)); return; }
  await setDoc(doc(db,"frequencia",id), { funcionarioId, obraId, data: dataISO });
}

async function saveObservacao(data){
  await setDoc(doc(db,"observacoes",uid()), { ...data, criadoEm: Date.now() });
}
async function removeObservacao(id){ await deleteDoc(doc(db,"observacoes",id)); }

function bindPeriodPicker(prefix, onChange){
  document.getElementById(prefix+"-month").addEventListener("change", e=>{ state.period.month = Number(e.target.value); onChange(); });

  document.querySelectorAll(`#${prefix}-tipo button`).forEach(b=>{
    b.addEventListener("click", ()=>{ state.period.tipo = b.dataset.tipo; onChange(); });
  });
}

    .filter(x=>x.valor>0).sort((a,b)=>b.valor-a.valor).slice(0,8);

    <div class="grid-4" style="margin-bottom:20px;">
      <div class="card kpi"><div class="label">Custo total m.o.</div><div class="value">${brl(calc.grandTotalValor)}</div><div class="delta">${calc.grandTotalDias} diária${calc.grandTotalDias===1?"":"s"} lançada${calc.grandTotalDias===1?"":"s"}</div></div>
      <div class="card kpi"><div class="label">Obras com custo</div><div class="value">${nObrasAtivas}</div><div class="delta">de ${calc.obrasAtivas.length} cadastradas</div></div>
      <div class="card kpi"><div class="label">Equipe ativa</div><div class="value">${nFuncAtivos}</div><div class="delta">de ${calc.funcsAtivos.length} cadastrados</div></div>
      <div class="card kpi"><div class="label">Custo médio / obra</div><div class="value">${brl(nObrasAtivas? calc.grandTotalValor/nObrasAtivas : 0)}</div><div class="delta">no período</div></div>

      <div class="card">
        <h3 style="font-size:14.5px;margin-bottom:14px;">Custo por obra</h3>
        ${obrasComCusto.length? `<canvas id="chart-obra" height="220"></canvas>` : emptyState("Sem lançamentos", "Nenhum custo registrado neste período ainda.")}
      </div>
      <div class="card">
        <h3 style="font-size:14.5px;margin-bottom:6px;">Ranking da equipe</h3>
        ${ranking.length ? ranking.map(r=>{
          const max = ranking[0].valor || 1;
          return `<div style="margin:12px 0;">

          </div>`;
        }).join("") : emptyState("Sem lançamentos", "Ninguém tem custo neste período ainda.")}
      </div>
    </div>

    <div class="card">
      <h3 style="font-size:14.5px;margin-bottom:14px;">Peso de cada obra no custo de mão de obra</h3>
      ${obrasComCusto.length ? `<table><thead><tr><th>Obra</th><th class="num-cell">Custo</th><th class="num-cell">Peso</th></tr></thead><tbody>
        ${obrasComCusto.map(x=>`<tr>
          <td><span class="tag ${obraColorClass(x.obra.id)}">${escapeHtml(x.obra.sigla)}</span> ${escapeHtml(x.obra.nome)}</td>
          <td class="num-cell mono">${brl(x.valor)}</td>

        </tr>`).join("")}
        <tr class="total-row"><td>Total</td><td class="num-cell mono">${brl(calc.grandTotalValor)}</td><td class="num-cell mono">100,0%</td></tr>

function obraHex(obraId){
  const map = ["#004422","#B8842A","#55707C","#8B4A3D","#6E5B7A","#49584F"];
  const idx = state.obras.findIndex(o=>o.id===obraId);
  return map[(idx>=0?idx:0) % map.length];
}
function emptyState(title, sub){
  return `<div class="empty-state"><div class="glyph">◇</div><h3>${title}</h3><p>${sub}</p></div>`;
}

/* ============================================================
   FREQUÊNCIA — lançamento por dia + obra: escolhe o dia, escolhe
   a obra e marca quem trabalhou lá. Um funcionário só pode estar
   em uma obra por dia — marcar em outra move automaticamente.
============================================================ */
function renderFrequencia(){
  const el = document.getElementById("view-frequencia");
  if(state.currentView !== "frequencia") return;
  const ativos = state.funcionarios.filter(f=>f.ativo!==false);
  const obrasAtivas = state.obras.filter(o=>o.ativo!==false);
  if(!state.freqSel.obraId && obrasAtivas.length) state.freqSel.obraId = obrasAtivas[0].id;
  const { dateISO, obraId } = state.freqSel;
  const obraAtual = obraById(obraId);
  const dt = new Date(dateISO + "T00:00:00");
  const dataFmt = dt.toLocaleDateString("pt-BR", {weekday:"long", day:"2-digit", month:"long", year:"numeric"});

  el.innerHTML = `
    <div class="page-head">
      <div>
        <span class="eyebrow">Escolha o dia e a obra</span>
        <h2>Frequência</h2>
        <p class="sub">Marque quem trabalhou em cada obra no dia. Um funcionário só pode estar em uma obra por dia.</p>
      </div>
    </div>

    <div class="card" style="margin-bottom:18px;padding:16px 20px;">
      <div class="field-row" style="align-items:flex-end;flex-wrap:wrap;">
        <div class="field" style="max-width:190px;">
          <label>Dia</label>
          <input type="date" id="freq-date" value="${dateISO}">
        </div>
        <div class="field" style="flex:1;min-width:160px;">
          <label style="text-transform:capitalize;">${dataFmt}</label>
          <div class="segmented" style="width:100%;">
            <button class="btn small" id="freq-day-prev" style="border-radius:6px 0 0 6px;">◂ dia anterior</button>
            <button class="btn small" id="freq-day-today" style="border-radius:0;">hoje</button>
            <button class="btn small" id="freq-day-next" style="border-radius:0 6px 6px 0;">próximo dia ▸</button>
          </div>
        </div>
      </div>
    </div>

    ${!ativos.length ? emptyStateCard("Sem funcionários", "Cadastre funcionários na aba Cadastros para começar a lançar frequência.") :
    !obrasAtivas.length ? emptyStateCard("Sem obras", "Cadastre ao menos uma obra na aba Cadastros para lançar frequência.") :
    `<div class="grid-2" style="align-items:start;">
      <div class="card">
        <h3 style="font-size:14.5px;margin-bottom:10px;">1. Escolha a obra</h3>
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:4px;">
          ${obrasAtivas.map(o=>`
            <button class="obra-chip ${o.id===obraId?"active":""}" data-obra="${o.id}">
              <span class="swatch ${obraColorClass(o.id)}"></span>${escapeHtml(o.sigla)}
            </button>`).join("")}
        </div>
        <p style="font-size:12px;color:var(--steel-600);margin-top:10px;">${obraAtual?escapeHtml(obraAtual.nome):""}</p>

        <h3 style="font-size:14.5px;margin:18px 0 8px;">2. Marque quem trabalhou aqui</h3>
        <div id="freq-checklist"></div>
      </div>

      <div class="card">
        <h3 style="font-size:14.5px;margin-bottom:10px;">Resumo do dia</h3>
        <div id="freq-day-summary"></div>
      </div>
    </div>`}
  `;

  if(!ativos.length || !obrasAtivas.length) return;

  document.getElementById("freq-date").addEventListener("change", e=>{
    if(e.target.value){ state.freqSel.dateISO = e.target.value; renderFrequencia(); }
  });
  document.getElementById("freq-day-prev").addEventListener("click", ()=> shiftFreqDay(-1));
  document.getElementById("freq-day-next").addEventListener("click", ()=> shiftFreqDay(1));
  document.getElementById("freq-day-today").addEventListener("click", ()=>{
    state.freqSel.dateISO = dateStr(today.getFullYear(), today.getMonth()+1, today.getDate());
    renderFrequencia();
  });
  el.querySelectorAll(".obra-chip").forEach(btn=>{
    btn.addEventListener("click", ()=>{ state.freqSel.obraId = btn.dataset.obra; renderFrequencia(); });
  });

  renderFreqChecklist();
  renderFreqDaySummary();
}

function shiftFreqDay(delta){
  const d = new Date(state.freqSel.dateISO + "T00:00:00");
  d.setDate(d.getDate()+delta);
  state.freqSel.dateISO = dateStr(d.getFullYear(), d.getMonth()+1, d.getDate());
  renderFrequencia();
}

function renderFreqChecklist(){
  const wrap = document.getElementById("freq-checklist");
  if(!wrap) return;
  const { dateISO, obraId } = state.freqSel;
  const ativos = state.funcionarios.filter(f=>f.ativo!==false);
  const doDia = state.frequencia.filter(e=>e.data===dateISO);

  wrap.innerHTML = ativos.map(f=>{
    const entry = doDia.find(e=>e.funcionarioId===f.id);
    const aqui = entry && entry.obraId === obraId;
    const outraObra = entry && entry.obraId !== obraId ? obraById(entry.obraId) : null;
    return `
      <label class="check-row ${aqui?"checked":""}" data-func="${f.id}">
        <input type="checkbox" ${aqui?"checked":""} data-func="${f.id}">
        <div class="info">
          <div class="name">${escapeHtml(f.nome)}</div>
          <div class="meta">${escapeHtml(f.funcao||"—")}</div>
        </div>
        ${outraObra ? `<span class="tag ${obraColorClass(outraObra.id)}" title="Já lançado em outra obra hoje">${escapeHtml(outraObra.sigla)} hoje</span>` : ""}
      </label>`;
  }).join("");

  wrap.querySelectorAll("input[type=checkbox]").forEach(cb=>{
    cb.addEventListener("change", async ()=>{
      const funcionarioId = cb.dataset.func;
      const f = funcById(funcionarioId);
      const entry = state.frequencia.find(e=>e.data===dateISO && e.funcionarioId===funcionarioId);
      if(cb.checked){
        if(entry && entry.obraId !== obraId){
          const deObra = obraById(entry.obraId);
          cb.checked = false; // aguarda confirmação
          confirmModal(
            `${escapeHtml(f.nome)} já está lançado em <b>${deObra?escapeHtml(deObra.nome):"outra obra"}</b> neste dia. Mover para <b>${escapeHtml(obraById(obraId).nome)}</b>?`,
            async ()=>{
              try{ await setFrequencia(funcionarioId, dateISO, obraId); toast("Funcionário movido de obra", "ok"); }
              catch(e){ console.error(e); toast("Erro ao salvar", "err"); }
            }
          );
        }else{
          try{ await setFrequencia(funcionarioId, dateISO, obraId); }
          catch(e){ console.error(e); toast("Erro ao salvar. Verifique o Firebase.", "err"); cb.checked=false; }
        }
      }else{
        try{ await setFrequencia(funcionarioId, dateISO, null); }
        catch(e){ console.error(e); toast("Erro ao remover", "err"); cb.checked=true; }
      }
    });
  });
}

function renderFreqDaySummary(){
  const wrap = document.getElementById("freq-day-summary");
  if(!wrap) return;
  const { dateISO } = state.freqSel;
  const obrasAtivas = state.obras.filter(o=>o.ativo!==false);
  const ativos = state.funcionarios.filter(f=>f.ativo!==false);
  const doDia = state.frequencia.filter(e=>e.data===dateISO);
  const semLancamento = ativos.filter(f=> !doDia.some(e=>e.funcionarioId===f.id));

  wrap.innerHTML = obrasAtivas.map(o=>{
    const gente = doDia.filter(e=>e.obraId===o.id).map(e=>funcById(e.funcionarioId)).filter(Boolean);
    return `<div style="margin-bottom:14px;">
      <div style="display:flex;align-items:center;gap:7px;margin-bottom:6px;">
        <span class="tag ${obraColorClass(o.id)}">${escapeHtml(o.sigla)}</span>
        <b style="font-size:13px;">${escapeHtml(o.nome)}</b>
        <span style="color:var(--steel-600);font-size:12px;margin-left:auto;">${gente.length}</span>
      </div>
      ${gente.length ? `<div style="display:flex;flex-wrap:wrap;gap:6px;">${gente.map(f=>`<span class="pill">${escapeHtml(f.nome)}</span>`).join("")}</div>`
        : `<p style="font-size:12.5px;color:var(--steel-600);margin:0;">Ninguém lançado ainda.</p>`}
    </div>`;
  }).join("") + `
    <div style="border-top:1px solid var(--line);padding-top:12px;margin-top:4px;">
      <div style="display:flex;align-items:center;gap:7px;margin-bottom:6px;">
        <span class="pill off">?</span><b style="font-size:13px;">Sem lançamento hoje</b>
        <span style="color:var(--steel-600);font-size:12px;margin-left:auto;">${semLancamento.length}</span>
      </div>
      ${semLancamento.length ? `<div style="display:flex;flex-wrap:wrap;gap:6px;">${semLancamento.map(f=>`<span class="pill">${escapeHtml(f.nome)}</span>`).join("")}</div>`
        : `<p style="font-size:12.5px;color:var(--steel-600);margin:0;">Todo mundo já tem obra hoje.</p>`}
    </div>`;
}

function emptyStateCard(title, sub){
  return `<div class="card">${emptyState(title, sub)}</div>`;
}

/* ============================================================
   FECHAMENTO — grade funcionário × obra (equivalente à planilha)
============================================================ */
function renderFechamento(){
  const el = document.getElementById("view-fechamento");
  if(state.currentView !== "fechamento") return;
  const calc = computeFechamento(state.period.year, state.period.month, state.period.tipo);
  const obras = calc.obrasAtivas;
  const funcs = calc.funcsAtivos;

  el.innerHTML = `
    <div class="page-head">
      <div>
        <span class="eyebrow">Grade de custo</span>
        <h2>Fechamento</h2>
        <p class="sub">${periodLabel(state.period.year, state.period.month, state.period.tipo)} — valor = dias trabalhados × diária</p>
      </div>
      <button class="btn dark" id="btn-export-fechamento">Exportar CSV</button>
    </div>
    <div class="card" style="margin-bottom:18px;padding:16px 20px;">${periodPickerHtml("fech")}</div>
    <div class="card" style="overflow:auto;">
      ${!funcs.length || !obras.length ? emptyState("Sem dados", "Cadastre funcionários e obras, depois lance a frequência.") : `
      <table>
        <thead><tr>
          <th>Funcionário</th><th>Vínculo</th>
          ${obras.map(o=>`<th class="num-cell"><span class="tag ${obraColorClass(o.id)}">${escapeHtml(o.sigla)}</span></th>`).join("")}
          <th class="num-cell">Total</th>
        </tr></thead>
        <tbody>
          ${funcs.map(f=>`<tr>
            <td>${escapeHtml(f.nome)}</td>
            <td><span class="pill">${escapeHtml(f.vinculo||"—")}</span></td>
            ${obras.map(o=>{
              const cell = (calc.matrix[f.id] && calc.matrix[f.id][o.id]) || {dias:0,valor:0};
              return `<td class="num-cell mono">${cell.dias? brl(cell.valor)+`<div style="font-size:10.5px;color:var(--steel-600);">${cell.dias}d</div>` : "—"}</td>`;
            }).join("")}
            <td class="num-cell mono" style="font-weight:700;">${brl(calc.totalPorFuncionario[f.id]||0)}</td>
          </tr>`).join("")}
          <tr class="total-row">
            <td colspan="2">Total por obra</td>
            ${obras.map(o=>`<td class="num-cell mono">${brl(calc.totalPorObra[o.id]||0)}</td>`).join("")}
            <td class="num-cell mono">${brl(calc.grandTotalValor)}</td>
          </tr>
        </tbody>
      </table>`}
    </div>
  `;
  bindPeriodPicker("fech", renderAll);
  document.getElementById("btn-export-fechamento")?.addEventListener("click", ()=>{
    const rows = [["Funcionário","Vínculo", ...obras.map(o=>o.sigla), "Total"]];
    funcs.forEach(f=>{
      rows.push([f.nome, f.vinculo||"", ...obras.map(o=>{
        const cell=(calc.matrix[f.id]&&calc.matrix[f.id][o.id])||{valor:0};
        return cell.valor.toFixed(2).replace(".",",");
      }), (calc.totalPorFuncionario[f.id]||0).toFixed(2).replace(".",",")]);
    });
    rows.push(["Total por obra","", ...obras.map(o=>(calc.totalPorObra[o.id]||0).toFixed(2).replace(".",",")), calc.grandTotalValor.toFixed(2).replace(".",",")]);
    downloadCsv(rows, `fechamento_${periodFileTag()}.csv`);
  });
}
function periodFileTag(){
  const {year,month,tipo} = state.period;
  return `${year}-${pad2(month)}-${tipo}`;
}
function downloadCsv(rows, filename){
  const csv = rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(";")).join("\r\n");
  const blob = new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8;"});
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = filename;
  link.click();
}

/* ============================================================
   RATEIO SIENGE — peso % por obra para lançar os títulos
============================================================ */
function renderRateio(){
  const el = document.getElementById("view-rateio");
  if(state.currentView !== "rateio") return;
  const ativos = state.funcionarios.filter(f=>f.ativo!==false);
  const selFuncId = state.rateioFuncId || "";
  const linhas = computeRateioSienge(state.period.year, state.period.month, state.period.tipo, selFuncId || null);

  el.innerHTML = `
    <div class="page-head">
      <div>
        <span class="eyebrow">Pronto para o Sienge</span>
        <h2>Rateio por peso</h2>
        <p class="sub">${periodLabel(state.period.year, state.period.month, state.period.tipo)} — use o peso (%) ao criar o título com múltiplas obras</p>
      </div>
      <button class="btn dark" id="btn-copiar-rateio">Copiar tabela</button>
    </div>
    <div class="card" style="margin-bottom:18px;padding:16px 20px;">
      ${periodPickerHtml("rat")}
      <div class="field" style="margin-top:12px;max-width:280px;">
        <label>Funcionário</label>
        <select id="rat-func">
          <option value="">Todos os funcionários</option>
          ${ativos.map(f=>`<option value="${f.id}" ${selFuncId===f.id?"selected":""}>${escapeHtml(f.nome)}</option>`).join("")}
        </select>
      </div>
    </div>

    ${!linhas.length ? emptyStateCard("Nada a ratear", "Nenhum lançamento de frequência encontrado para este período/funcionário.") :
      linhas.map(r=>`
      <div class="card" style="margin-bottom:14px;">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;">
          <h3 style="font-size:14.5px;">${escapeHtml(r.funcionario.nome)}</h3>
          <span class="mono" style="font-size:13px;color:var(--steel-600);">total ${brl(r.total)}</span>
        </div>
        <table>
          <thead><tr><th>Obra</th><th class="num-cell">Dias</th><th class="num-cell">Valor</th><th class="num-cell">Peso p/ Sienge</th></tr></thead>
          <tbody>
            ${r.linhas.map(l=>`<tr>
              <td><span class="tag ${obraColorClass(l.obra.id)}">${escapeHtml(l.obra.sigla)}</span> ${escapeHtml(l.obra.nome)}</td>
              <td class="num-cell mono">${l.dias}</td>
              <td class="num-cell mono">${brl(l.valor)}</td>
              <td class="num-cell mono" style="font-weight:700;">${pct(l.peso)}</td>
            </tr>`).join("")}
          </tbody>
        </table>
      </div>`).join("")
    }
  `;
  bindPeriodPicker("rat", renderAll);
  document.getElementById("rat-func").addEventListener("change", e=>{ state.rateioFuncId = e.target.value; renderRateio(); });
  document.getElementById("btn-copiar-rateio").addEventListener("click", ()=>{
    if(!linhas.length){ toast("Nada para copiar", "err"); return; }
    let txt = "";
    linhas.forEach(r=>{
      txt += `${r.funcionario.nome}\r\n`;
      txt += `Obra\tDias\tValor\tPeso\r\n`;
      r.linhas.forEach(l=> txt += `${l.obra.nome} (${l.obra.sigla})\t${l.dias}\t${l.valor.toFixed(2).replace(".",",")}\t${l.peso.toFixed(1).replace(".",",")}%\r\n`);
      txt += `\r\n`;
    });
    navigator.clipboard.writeText(txt).then(()=>toast("Tabela copiada — cole no Sienge ou no Excel", "ok"))
      .catch(()=>toast("Não foi possível copiar automaticamente", "err"));
  });
}

function renderObsList(lista){

}
function obsItemHtml(o, printMode){
  const f = o.funcionarioId ? funcById(o.funcionarioId) : null;
  const ob = o.obraId ? obraById(o.obraId) : null;
  return `<div class="obs-item">
    <div class="obs-head">
      <span class="obs-date">${formatDateBr(o.data)}</span>
      <span class="obs-who">${f?escapeHtml(f.nome):""}${f&&ob?" · ":""}${ob?escapeHtml(ob.sigla):""}${o.autor?` · lançado por ${escapeHtml(o.autor)}`:""}</span>
    </div>
    <div class="obs-text">${escapeHtml(o.texto)}</div>
    ${!printMode ? `<div class="obs-actions"><button class="btn small danger" data-del-obs="${o.id}">Excluir</button></div>` : ""}
  </div>`;
}
function formatDateBr(iso){
  if(!iso) return "";
  const [y,m,d] = iso.split("-");
  return `${d}/${m}/${y}`;
}

function confirmModal(text, onConfirm){
  modal(`
    <h3>${onConfirm? "Confirmar exclusão" : "Não é possível excluir"}</h3>
    <p>${text}</p>
    <div class="actions">
      <button class="btn" id="modal-cancel">${onConfirm?"Cancelar":"Entendi"}</button>
      ${onConfirm? `<button class="btn danger" id="modal-ok">Excluir</button>` : ""}
    </div>
  `);
  document.getElementById("modal-cancel").addEventListener("click", closeModal);
  if(onConfirm) document.getElementById("modal-ok").addEventListener("click", async ()=>{ await onConfirm(); closeModal(); });
}

/* ============================================================
   RENDER ALL
============================================================ */
function renderAll(){
  if(!state.user) return;
  renderDashboard();
  renderFrequencia();
  renderFechamento();
  renderRateio();
  renderObservacoes();
  renderCadastro();
}

/* ============================================================
   AUTENTICAÇÃO (anônima, com nome de exibição salvo localmente)
============================================================ */
document.getElementById("btn-entrar").addEventListener("click", doEntrar);
document.getElementById("team-name").addEventListener("keydown", e=>{ if(e.key==="Enter") doEntrar(); });

async function doEntrar(){
  const nome = document.getElementById("team-name").value.trim();
  const errEl = document.getElementById("auth-error");
  errEl.textContent = "";
  if(!nome){ errEl.textContent = "Digite seu nome para continuar."; return; }
  if(!FIREBASE_OK){ errEl.textContent = "Firebase não configurado — veja o README.md."; return; }
  try{
    await signInAnonymously(auth);
    localStorage.setItem("diario-obra-nome", nome);
  }catch(e){
    console.error(e);
    errEl.textContent = "Não foi possível entrar. Verifique a configuração do Firebase (Authentication → Anônimo habilitado).";
  }
}
document.getElementById("btn-sair").addEventListener("click", ()=>{
  auth.signOut();
  localStorage.removeItem("diario-obra-nome");
});

const savedName = localStorage.getItem("diario-obra-nome");
if(savedName) document.getElementById("team-name").value = savedName;

if(FIREBASE_OK){
  onAuthStateChanged(auth, user=>{
    if(user){
      state.user = { uid: user.uid, nome: localStorage.getItem("diario-obra-nome") || "Equipe" };
      document.getElementById("who-name").textContent = state.user.nome;
      document.getElementById("auth-gate").style.display = "none";
      document.getElementById("app").classList.add("ready");
      startListeners();
    }else{
      state.user = null;
      document.getElementById("auth-gate").style.display = "flex";
      document.getElementById("app").classList.remove("ready");
    }
  });
}else{
  document.getElementById("auth-error").textContent = "Firebase não configurado — veja o README.md para o passo a passo.";
}
</script>
</body>
